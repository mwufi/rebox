# Rebox Grafana: anonymous read-only viewers, the "Rebox graph" dashboard as home.
[server]
http_port = 3000

[auth.anonymous]
enabled = true
org_name = Main Org.
org_role = Viewer

[auth]
disable_login_form = false

[users]
allow_sign_up = false

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/rebox-graph.json

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[news]
news_feed_enabled = false
