# Loads every dashboard JSON in /var/lib/grafana/dashboards (infra/grafana/dashboards) read-only.
apiVersion: 1
providers:
  - name: rebox
    folder: Rebox
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
