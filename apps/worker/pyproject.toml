[project]
name = "rebox-worker"
version = "0.1.0"
description = "Rebox worker: connectors, raw store, resolver, job queue"
requires-python = ">=3.13"
dependencies = [
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "httpx>=0.27",
  "pydantic>=2.8",
  "boto3>=1.35",
]

[project.scripts]
rebox-worker = "rebox_worker.cli:main"

[dependency-groups]
dev = [
    "moto[s3]>=5",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rebox_worker"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
